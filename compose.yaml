services:
  neutralis-pools:
    build: .
    image: neutralis-pools:1.0.2
    restart: unless-stopped
    ports:
      - "8788:8788"
    volumes:
      - ./data:/data
    environment:
      PORT: "8788"
      NEUTRALIS_POOLS_DATA_DIR: /data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
